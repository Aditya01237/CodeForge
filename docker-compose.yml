services:
  redis:
    image: redis:7-alpine
    container_name: codeforge-redis
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - sh
      - -c
      - exec redis-server --protected-mode yes --bind 0.0.0.0 --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - codeforge-redis-data:/data

volumes:
  codeforge-redis-data:
