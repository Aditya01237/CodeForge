server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/codeforge}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Local uploaded image storage
codeforge.upload.dir=uploads

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# Seed a judge-ready DSA practice library on first startup.
codeforge.seed-problem-library=${SEED_PROBLEM_LIBRARY:true}
